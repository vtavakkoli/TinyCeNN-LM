services:
  test-hf:
    build:
      context: .
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-pytorch/pytorch:2.14.0-cuda12.6-cudnn9-runtime}
    image: tinycenn-lm:local
    gpus: all
    shm_size: "2gb"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /cache/huggingface
      TRANSFORMERS_CACHE: /cache/huggingface/transformers
      TOKENIZERS_PARALLELISM: "true"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      HF_REVISION: ${HF_REVISION:-main}
      MAX_NEW_TOKENS: ${TEST_MAX_NEW_TOKENS:-32}
    volumes:
      - hf-cache:/cache/huggingface
    command:
      - bash
      - -lc
      - >-
        python scripts/test_hf_model.py
        --repo-id "$${HF_MODEL_REPO}"
        --revision "$${HF_REVISION}"
        --max-new-tokens "$${MAX_NEW_TOKENS}"

volumes:
  hf-cache:
