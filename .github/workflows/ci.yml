name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q
      - name: Python syntax check
        run: python -m compileall -q src scripts tests
      - name: Shell syntax check
        run: bash -n scripts/docker_train.sh
      - name: Notebook JSON, code-cell, and credential check
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("notebooks/TinyCeNN_LM_Colab.ipynb")
          source = path.read_text(encoding="utf-8")
          notebook = json.loads(source)
          assert notebook["nbformat"] == 4

          leaked = re.findall(r"hf_[A-Za-z0-9]{24,}", source)
          assert not leaked, "A Hugging Face token-like credential is embedded in the notebook"

          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              cell_source = "".join(cell.get("source", []))
              # Colab/IPython shell and magic lines are valid notebook syntax but not Python AST syntax.
              cleaned = "\n".join(
                  line
                  for line in cell_source.splitlines()
                  if not line.lstrip().startswith(("!", "%"))
              )
              compile(cleaned, f"notebook_cell_{index}", "exec")

          print("Notebook JSON/code cells valid; no embedded HF token-like credential found")
          PY
      - name: Docker Compose syntax check
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet
