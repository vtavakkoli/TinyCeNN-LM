name: Research layers Colab

on:
  push:
    paths:
      - "src/tinycenn_lm/research_layers.py"
      - "scripts/benchmark_cenn_research_layers.py"
      - "tests/test_research_layer*.py"
      - "notebooks/CeNN_Research_Layers_Colab.ipynb"
      - ".github/workflows/research-layers-colab.yml"
  pull_request:
    paths:
      - "src/tinycenn_lm/research_layers.py"
      - "scripts/benchmark_cenn_research_layers.py"
      - "tests/test_research_layer*.py"
      - "notebooks/CeNN_Research_Layers_Colab.ipynb"
      - ".github/workflows/research-layers-colab.yml"

permissions:
  contents: read

jobs:
  colab-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the notebook dependency profile on CPU
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers==4.57.6" "datasets>=3,<5" pandas matplotlib pytest nbformat
          python -m pip install -e . --no-deps
      - name: Recurrence and real Llama integration checks
        run: python -m pytest -q tests/test_research_layers.py tests/test_research_layer_benchmark.py
      - name: Validate notebook schema and all code cells
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          path = Path("notebooks/CeNN_Research_Layers_Colab.ipynb")
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          for index, cell in enumerate(notebook.cells):
              if cell.cell_type == "code":
                  assert cell.execution_count is None and not cell.outputs
                  compile(cell.source, f"{path}:cell_{index}", "exec")
          print("Notebook schema and code cells validated.")
          PY
